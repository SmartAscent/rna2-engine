[package]
name = "rna2_pm"
version = "0.1.0"
edition = "2021"

[lib]
name = "rna2_pm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rna2_pm_cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.10.2"
